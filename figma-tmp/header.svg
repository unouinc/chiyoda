<svg xmlns="http://www.w3.org/2000/svg" width="4692" height="1300" viewBox="0 0 4692 1300"><rect width="4692" height="1300" fill="#FFFFFF" stroke="#D6DAE0" stroke-width="2"/><text x="96" y="124" font-family="Noto Sans JP" font-size="28" font-weight="700" fill="#6B7280" text-anchor="start">MOODBOARD</text><text x="96" y="206" font-family="Noto Sans JP" font-size="64" font-weight="700" fill="#2A3A4D" text-anchor="start">千代田興業 コーポレートサイト｜ビジュアルの方向性</text><text x="96" y="266" font-family="Noto Sans JP" font-size="26" font-weight="400" fill="#6B7280" text-anchor="start">デザイナー向けの整理。下の参考サイト4件と各メモをもとに、目指すトーンをまとめています。</text><rect x="96" y="316" width="4500" height="2" fill="#D6DAE0"/><text x="96" y="396" font-family="Noto Sans JP" font-size="30" font-weight="700" fill="#1E3A5F" text-anchor="start">01　コンセプト</text><rect x="96" y="426" width="1500" height="110" fill="#F5F6F8" stroke="#D6DAE0" stroke-width="1.5"/><text x="128" y="490" font-family="Noto Sans JP" font-size="22" font-weight="700" fill="#6B7280" text-anchor="start">タグライン</text><text x="356" y="490" font-family="Noto Sans JP" font-size="26" font-weight="500" fill="#2A3A4D" text-anchor="start">KEEP DRIVING</text><rect x="96" y="552" width="1500" height="110" fill="#F5F6F8" stroke="#D6DAE0" stroke-width="1.5"/><text x="128" y="616" font-family="Noto Sans JP" font-size="22" font-weight="700" fill="#6B7280" text-anchor="start">サブコピー</text><text x="356" y="616" font-family="Noto Sans JP" font-size="26" font-weight="500" fill="#2A3A4D" text-anchor="start">85年つないできた技術を、次の100年へ。</text><rect x="96" y="678" width="1500" height="110" fill="#F5F6F8" stroke="#D6DAE0" stroke-width="1.5"/><text x="128" y="742" font-family="Noto Sans JP" font-size="22" font-weight="700" fill="#6B7280" text-anchor="start">核の言葉</text><text x="356" y="742" font-family="Noto Sans JP" font-size="26" font-weight="500" fill="#2A3A4D" text-anchor="start">つなぐ</text><rect x="96" y="804" width="1500" height="110" fill="#F5F6F8" stroke="#D6DAE0" stroke-width="1.5"/><text x="128" y="868" font-family="Noto Sans JP" font-size="22" font-weight="700" fill="#6B7280" text-anchor="start">キーワード</text><text x="356" y="868" font-family="Noto Sans JP" font-size="26" font-weight="500" fill="#2A3A4D" text-anchor="start">職人・技術／責任感／誠実</text><rect x="96" y="930" width="1500" height="110" fill="#F5F6F8" stroke="#D6DAE0" stroke-width="1.5"/><text x="128" y="994" font-family="Noto Sans JP" font-size="22" font-weight="700" fill="#6B7280" text-anchor="start">カラー</text><text x="356" y="994" font-family="Noto Sans JP" font-size="26" font-weight="500" fill="#2A3A4D" text-anchor="start">コーポレートカラーの青をベースに（白・黒の無機質表現に寄せない）</text><rect x="96" y="1056" width="1500" height="110" fill="#F5F6F8" stroke="#D6DAE0" stroke-width="1.5"/><text x="128" y="1120" font-family="Noto Sans JP" font-size="22" font-weight="700" fill="#6B7280" text-anchor="start">写真</text><text x="356" y="1120" font-family="Noto Sans JP" font-size="26" font-weight="500" fill="#2A3A4D" text-anchor="start">大きな画像で大胆に。技術や人をリアルに見せる</text><text x="1736" y="396" font-family="Noto Sans JP" font-size="30" font-weight="700" fill="#1E3A5F" text-anchor="start">02　トーンのスケール</text><text x="2116" y="396" font-family="Noto Sans JP" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">点の位置が目指す方向。中央が中立。</text><text x="2032" y="526" font-family="Noto Sans JP" font-size="30" font-weight="700" fill="#2A3A4D" text-anchor="end">シンプル</text><text x="4300" y="526" font-family="Noto Sans JP" font-size="30" font-weight="700" fill="#2A3A4D" text-anchor="start">装飾的</text><rect x="2056" y="514.5" width="2220" height="3" fill="#D6DAE0"/><rect x="2054.5" y="508.0" width="3" height="16" fill="#D6DAE0"/><rect x="2424.5" y="508.0" width="3" height="16" fill="#D6DAE0"/><rect x="2794.5" y="508.0" width="3" height="16" fill="#D6DAE0"/><rect x="3164.5" y="502.0" width="3" height="28" fill="#6B7280"/><rect x="3534.5" y="508.0" width="3" height="16" fill="#D6DAE0"/><rect x="3904.5" y="508.0" width="3" height="16" fill="#D6DAE0"/><rect x="4274.5" y="508.0" width="3" height="16" fill="#D6DAE0"/><circle cx="2241.0" cy="516" r="20" fill="#1E3A5F"/><text x="3166.0" y="578" font-family="Noto Sans JP" font-size="22" font-weight="400" fill="#6B7280" text-anchor="middle">全参考で「シンプルで洗練＝技術」を評価</text><text x="2032" y="696" font-family="Noto Sans JP" font-size="30" font-weight="700" fill="#2A3A4D" text-anchor="end">規則的・整然</text><text x="4300" y="696" font-family="Noto Sans JP" font-size="30" font-weight="700" fill="#2A3A4D" text-anchor="start">自由・ランダム</text><rect x="2056" y="684.5" width="2220" height="3" fill="#D6DAE0"/><rect x="2054.5" y="678.0" width="3" height="16" fill="#D6DAE0"/><rect x="2424.5" y="678.0" width="3" height="16" fill="#D6DAE0"/><rect x="2794.5" y="678.0" width="3" height="16" fill="#D6DAE0"/><rect x="3164.5" y="672.0" width="3" height="28" fill="#6B7280"/><rect x="3534.5" y="678.0" width="3" height="16" fill="#D6DAE0"/><rect x="3904.5" y="678.0" width="3" height="16" fill="#D6DAE0"/><rect x="4274.5" y="678.0" width="3" height="16" fill="#D6DAE0"/><circle cx="2796.0" cy="686" r="20" fill="#1E3A5F"/><text x="3166.0" y="748" font-family="Noto Sans JP" font-size="22" font-weight="400" fill="#6B7280" text-anchor="middle">規則性＝正確・誠実。ただし規則的すぎない</text><text x="2032" y="866" font-family="Noto Sans JP" font-size="30" font-weight="700" fill="#2A3A4D" text-anchor="end">伝統・重厚</text><text x="4300" y="866" font-family="Noto Sans JP" font-size="30" font-weight="700" fill="#2A3A4D" text-anchor="start">新しさ・軽やか</text><rect x="2056" y="854.5" width="2220" height="3" fill="#D6DAE0"/><rect x="2054.5" y="848.0" width="3" height="16" fill="#D6DAE0"/><rect x="2424.5" y="848.0" width="3" height="16" fill="#D6DAE0"/><rect x="2794.5" y="848.0" width="3" height="16" fill="#D6DAE0"/><rect x="3164.5" y="842.0" width="3" height="28" fill="#6B7280"/><rect x="3534.5" y="848.0" width="3" height="16" fill="#D6DAE0"/><rect x="3904.5" y="848.0" width="3" height="16" fill="#D6DAE0"/><rect x="4274.5" y="848.0" width="3" height="16" fill="#D6DAE0"/><circle cx="3536.0" cy="856" r="20" fill="#1E3A5F"/><text x="3166.0" y="918" font-family="Noto Sans JP" font-size="22" font-weight="400" fill="#6B7280" text-anchor="middle">技術の重みは保ちつつ、新しさは感じさせる</text><text x="2032" y="1036" font-family="Noto Sans JP" font-size="30" font-weight="700" fill="#2A3A4D" text-anchor="end">落ち着き</text><text x="4300" y="1036" font-family="Noto Sans JP" font-size="30" font-weight="700" fill="#2A3A4D" text-anchor="start">ポップ</text><rect x="2056" y="1024.5" width="2220" height="3" fill="#D6DAE0"/><rect x="2054.5" y="1018.0" width="3" height="16" fill="#D6DAE0"/><rect x="2424.5" y="1018.0" width="3" height="16" fill="#D6DAE0"/><rect x="2794.5" y="1018.0" width="3" height="16" fill="#D6DAE0"/><rect x="3164.5" y="1012.0" width="3" height="28" fill="#6B7280"/><rect x="3534.5" y="1018.0" width="3" height="16" fill="#D6DAE0"/><rect x="3904.5" y="1018.0" width="3" height="16" fill="#D6DAE0"/><rect x="4274.5" y="1018.0" width="3" height="16" fill="#D6DAE0"/><circle cx="2611.0" cy="1026" r="20" fill="#1E3A5F"/><text x="3166.0" y="1088" font-family="Noto Sans JP" font-size="22" font-weight="400" fill="#6B7280" text-anchor="middle">遊び心はよいが、ポップには寄せない</text><text x="2032" y="1206" font-family="Noto Sans JP" font-size="30" font-weight="700" fill="#2A3A4D" text-anchor="end">デジタル・未来的</text><text x="4300" y="1206" font-family="Noto Sans JP" font-size="30" font-weight="700" fill="#2A3A4D" text-anchor="start">リアル・人の手</text><rect x="2056" y="1194.5" width="2220" height="3" fill="#D6DAE0"/><rect x="2054.5" y="1188.0" width="3" height="16" fill="#D6DAE0"/><rect x="2424.5" y="1188.0" width="3" height="16" fill="#D6DAE0"/><rect x="2794.5" y="1188.0" width="3" height="16" fill="#D6DAE0"/><rect x="3164.5" y="1182.0" width="3" height="28" fill="#6B7280"/><rect x="3534.5" y="1188.0" width="3" height="16" fill="#D6DAE0"/><rect x="3904.5" y="1188.0" width="3" height="16" fill="#D6DAE0"/><rect x="4274.5" y="1188.0" width="3" height="16" fill="#D6DAE0"/><circle cx="3721.0" cy="1196" r="20" fill="#1E3A5F"/><text x="3166.0" y="1258" font-family="Noto Sans JP" font-size="22" font-weight="400" fill="#6B7280" text-anchor="middle">未来館のようなKV、デジタル寄りの印象は避ける</text></svg>