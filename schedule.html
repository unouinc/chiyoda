<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><title>スケジュール（更新版）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E3A5F;--navy2:#2A3A4D;--blue:#2F6FD1;--gray:#6B7280;--line:#D6DAE0;--card:#F5F6F8;--green:#2E7D32;}
*{box-sizing:border-box;margin:0;padding:0}
html{width:100%}body{background:#e9ebee;font-family:"Noto Sans JP",sans-serif;color:#1F2933;padding:24px}
.slide{width:1280px;height:720px;background:#fff;margin:0 auto;position:relative;padding:48px 52px}
h1{font-size:30px;font-weight:700;letter-spacing:.04em}
.lead{font-size:13.5px;color:var(--gray);margin-top:12px;letter-spacing:.03em}
.gantt{position:relative;margin-top:20px;display:grid;grid-template-columns:52px 230px repeat(26,34px);grid-auto-rows:25px;font-size:11.5px}
.gantt>div{border-bottom:1px solid var(--line);display:flex;align-items:center}
.mh{grid-row:1;background:var(--navy2);color:#fff;justify-content:center;font-weight:700;font-size:13px;border-right:1px solid #fff}
.wk{grid-row:2;background:var(--card);justify-content:center;font-size:9.5px;color:#4B5563;border-right:1px solid var(--line)}
.cat{background:var(--card);justify-content:center;font-weight:700;color:var(--navy);font-size:11px;border-right:1px solid var(--line)}
.lb{padding-left:8px;border-right:1px solid var(--line)}
.cell{border-right:1px solid var(--line)}
.cell.mb{border-right:1px solid #9aa3ad}
.bar{position:absolute;height:17px;border-radius:2px;background:var(--navy2)}
.bar.c{background:var(--blue)}
.tp{position:absolute;height:19px;border:1.5px solid var(--green);background:#fff;border-radius:3px;color:var(--green);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.legend{position:absolute;left:52px;bottom:40px;display:flex;gap:40px;font-size:12px;align-items:center}
.legend i{display:inline-block;width:40px;height:12px;background:var(--navy2);vertical-align:middle;margin-right:8px;border-radius:2px}
.legend i.c{background:var(--blue)}
.fd{position:absolute;height:19px;background:#E8833A;color:#fff;border-radius:3px;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.legend b.fd2{display:inline-block;background:#E8833A;color:#fff;font-size:10.5px;padding:2px 8px;border-radius:3px;margin-right:8px}
.foot{position:absolute;right:52px;bottom:22px;font-size:10px;color:#9aa3ad}
.note{position:absolute;left:52px;bottom:18px;font-size:11px;color:#4B5563}
</style></head><body>
<div class="slide">
  <h1>スケジュール</h1>
  <p class="lead">11月13日時点の更新版。11/16にトップページと下層ページの1/3を合わせて提出し、残りを11/23の週・11/30の週に分けて提出。11月中にデザインを完了。撮影後に写真を差し替え、1月中旬〜下旬の公開を目指します。</p>
  <div class="gantt" id="g"></div>
  <div class="legend"><span><i></i>unouタスク</span><span><i class="c"></i>千代田興業様タスク（FB・検収）</span><span>✓①〜⑧ … タッチポイント（MTG）</span><span><b class="fd2">提出</b>ご提案・デザインの提出・FIX</span></div>
  <div class="foot">unou inc.｜千代田興業株式会社御中</div>
</div>
<script>
const months=[["8月",5],["9月",4],["10月",4],["11月",5],["12月",4],["1月",4]];
const weeks=["3日","10日","17日","24日","31日","7日","14日","21日","28日","5日","12日","19日","26日","2日","9日","16日","23日","30日","7日","14日","21日","28日","4日","11日","18日","25日"];
const rows=[
 ["要件定義","Kick Off",[],[[0,0,"✓①"]]],
 ["","経営層インタビュー（MVV策定）",[[1,3]],[[1,1,"✓②"]]],
 ["","ページの役割/目的定義・共通導線整理",[[1,4]],[]],
 ["","ブランド/デザインコンセプト定義",[[1,4]],[[3,3,"✓③"],[5,5,"✓④"]]],
 ["","MVVのご提案（10/22）→ 最終化（11月）",[[9,14]],[],[[11,"提案"]]],
 ["デザイン","WF作成・FIX",[[5,11]],[[8,8,"✓⑤"]]],
 ["","WF改善（デザイン初稿まで）",[[12,14]],[]],
 ["","トップページ（初稿 11/12 → FIX 11/16）",[[11,15]],[],[[14,"初稿"],[15,"FIX"]]],
 ["","下層ページ（3回に分けて提出）",[[14,17]],[],[[15,"1/3"],[16,"2/3"],[17,"3/3"]]],
 ["","デザインFB → FIX",[[14,17,"c"]],[[14,14,"✓⑥"]]],
 ["撮影","下見（10/29）・撮影対象の決定・許可申請",[[12,17]],[[12,12,"✓⑦"]]],
 ["","撮影（12/14〜18）→ 写真の差し替え",[[19,19],[20,22]],[]],
 ["開発","コーディング・CMS構築（FIX順に並行）",[[15,22]],[]],
 ["","CMSマニュアル作成",[[21,22]],[]],
 ["","テスト・検収",[[23,23,"c"]],[[23,23,"✓⑧"]]],
 ["","デプロイ・公開（1月中旬〜下旬目標）",[[24,25]],[]],
];
const g=document.getElementById('g');
let html='<div style="grid-row:1/3;border:none"></div><div style="grid-row:1/3;border:none"></div>';
let col=3;
months.forEach(([m,n])=>{html+=`<div class="mh" style="grid-column:${col}/${col+n}">${m}</div>`;col+=n;});
weeks.forEach((w,i)=>{html+=`<div class="wk" style="grid-column:${i+3}">${w}</div>`;});
const catRows={};rows.forEach((r,i)=>{if(r[0]){catRows[r[0]]=[i];}else{const k=Object.keys(catRows).pop();catRows[k].push(i);}});
Object.entries(catRows).forEach(([k,v])=>{html+=`<div class="cat" style="grid-column:1;grid-row:${v[0]+3}/${v[v.length-1]+4}">${k}</div>`;});
rows.forEach((r,i)=>{html+=`<div class="lb" style="grid-column:2;grid-row:${i+3}">${r[1]}</div>`;
 for(let c=0;c<26;c++){const mb=[4,8,12,17,21].includes(c);html+=`<div class="cell${mb?' mb':''}" style="grid-column:${c+3};grid-row:${i+3}"></div>`;}});
g.innerHTML=html;
const X0=52+230, W=34, Y0=50, H=25;
rows.forEach((r,i)=>{
 r[2].forEach(([s,e,c])=>{const b=document.createElement('div');b.className='bar'+(c?' c':'');b.style.left=(X0+s*W+2)+'px';b.style.width=((e-s+1)*W-4)+'px';b.style.top=(Y0+i*H+4)+'px';g.appendChild(b);});
 r[3].forEach(([s,e,t])=>{const b=document.createElement('div');b.className='tp';b.textContent=t;b.style.left=(X0+s*W+3)+'px';b.style.width=(W-6)+'px';b.style.top=(Y0+i*H+3)+'px';g.appendChild(b);});
 (r[4]||[]).forEach(x=>{const [w,t]=Array.isArray(x)?x:[x,'初稿'];const b=document.createElement('div');b.className='fd';b.textContent=t;b.style.left=(X0+w*W+3)+'px';b.style.width=(W-6)+'px';b.style.top=(Y0+i*H+3)+'px';g.appendChild(b);});
});

const fit=()=>{const sl=document.querySelector('.slide');const sc=Math.min(1,(window.innerWidth-48)/1280);sl.style.transformOrigin='top left';sl.style.transform=`scale(${sc})`;sl.style.marginLeft=Math.max(0,(window.innerWidth-48-1280*sc)/2)+'px';document.body.style.height=(720*sc+48)+'px';};
addEventListener('resize',fit);fit();
</script>
</body></html>
